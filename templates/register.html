{% extends "base.html" %}
{% block title %}Register — TalentLens AI{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="auth-sub">Join TalentLens AI as a candidate or a recruiter.</p>
        <form method="POST" class="form">
            <label>Full name
                <input type="text" name="name" required autofocus placeholder="Jane Doe">
            </label>
            <label>Email
                <input type="email" name="email" required placeholder="you@example.com">
            </label>
            <label>Password
                <input type="password" name="password" required minlength="6" placeholder="At least 6 characters">
            </label>
            <label>I am a...
                <select name="role">
                    <option value="candidate">Candidate — looking for a job</option>
                    <option value="recruiter">Recruiter — hiring candidates</option>
                </select>
            </label>
            <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</div>
{% endblock %}
