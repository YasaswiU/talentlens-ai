{% extends "base.html" %}
{% block title %}Login — TalentLens AI{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to continue to your TalentLens AI dashboard.</p>
        <form method="POST" class="form">
            <label>Email
                <input type="email" name="email" required autofocus placeholder="you@example.com">
            </label>
            <label>Password
                <input type="password" name="password" required placeholder="••••••••">
            </label>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
</div>
{% endblock %}
