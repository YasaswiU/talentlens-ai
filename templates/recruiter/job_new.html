{% extends "base.html" %}
{% block title %}New Job Posting — TalentLens AI{% endblock %}
{% block content %}
<div class="page-header"><h1>Create Job Posting</h1></div>
<div class="panel panel-narrow">
    <form method="POST" class="form">
        <label>Job title
            <input type="text" name="title" required placeholder="e.g. Python Developer">
        </label>
        <label>Job description
            <textarea name="description" rows="6" required placeholder="Describe the role, responsibilities, and expectations..."></textarea>
        </label>
        <label>Required skills (comma-separated)
            <input type="text" name="required_skills" required placeholder="python, sql, docker, aws">
        </label>
        <label>Minimum experience (years)
            <input type="number" step="0.5" min="0" name="minimum_experience" value="0">
        </label>
        <button type="submit" class="btn btn-primary btn-block">Publish Job</button>
    </form>
</div>
{% endblock %}
